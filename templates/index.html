<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NG-SIEM Log Tester</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1c2128; --muted: #5d6673; --line: #d5dae1;
    --accent: #c8102e; --accent-text: #fff; --code-bg: #14181f; --code-text: #e6e9ef;
    --ok: #17663a; --ok-bg: #e5f5ec; --bad: #a3141f; --bad-bg: #fcebec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1b2027; --text: #e6e9ef; --muted: #9aa4b2; --line: #333b47;
      --accent: #e0334c; --ok: #6fd69b; --ok-bg: #15301f; --bad: #ff9098; --bad-bg: #3a1a1e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  select, textarea { width: 100%; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  textarea { min-height: 280px; resize: vertical; background: var(--code-bg); color: var(--code-text); font: 13px/1.5 ui-monospace, Consolas, monospace; tab-size: 2; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row select { flex: 1; min-width: 200px; }
  button { font: inherit; font-weight: 600; border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .invalid { color: var(--bad); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; margin: 12px 0 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .parser { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
  .actions { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: end; margin-top: 16px; }
  .actions label { margin-bottom: 4px; }
  .result { padding: 12px 14px; border-radius: 6px; font-weight: 600; overflow-wrap: anywhere; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.bad { background: var(--bad-bg); color: var(--bad); }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 600; }
  .log { margin: 10px 0 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .entry { padding: 8px 10px; border-top: 1px solid var(--line); font-size: 13px; }
  .entry:first-child { border-top: 0; }
  .entry time { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; margin-right: 8px; }
  .entry.error .title { color: var(--bad); font-weight: 600; }
  .title { overflow-wrap: anywhere; }
  pre { margin: 6px 0 0; padding: 8px 10px; background: var(--code-bg); color: var(--code-text); border-radius: 4px; overflow-x: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>NG-SIEM Log Tester</h1>
  <p class="lede">Send a raw JSON log through a clone of a data connector. The original connector isn't changed, and the clone is deleted afterwards.</p>

  <section>
    <label for="connector">Data connector</label>
    <div class="row">
      <select id="connector" disabled><option value="">Loading connectors...</option></select>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <p class="hint" id="connector-hint" hidden></p>
    <dl id="details" hidden>
      <dt>Parser</dt><dd class="parser" id="d-parser"></dd>
      <dt>Type</dt><dd id="d-type"></dd>
      <dt>Status</dt><dd id="d-status"></dd>
      <dt>Vendor</dt><dd id="d-vendor"></dd>
    </dl>
  </section>

  <section>
    <label for="log">Raw JSON log</label>
    <textarea id="log" spellcheck="false" placeholder='{ "timestamp": "2026-11-01T12:00:00Z", "message": "example" }'></textarea>
    <p class="hint" id="log-hint">Paste one JSON object, or an array of objects to send several events.</p>
    <div class="actions">
      <div>
        <label for="mode">Send as</label>
        <select id="mode">
          <option value="event">HEC event: wrap in {"event": ...}</option>
          <option value="raw">Raw: send as-is to /raw</option>
        </select>
      </div>
      <div class="row">
        <button id="format" type="button">Format JSON</button>
        <button id="submit" type="button" class="primary" disabled>Clone connector and send log</button>
      </div>
    </div>
  </section>

  <section id="result-panel" aria-live="polite" hidden>
    <div class="result" id="result"></div>
    <details id="log-details">
      <summary id="log-summary">Verbose log</summary>
      <div class="log" id="log-entries"></div>
    </details>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const connectorSelect = $("connector"), logInput = $("log"), submitButton = $("submit");
  let selected = null, busy = false, selectionRequest = 0;

  function parseInput() {
    const text = logInput.value;
    if (!text.trim()) return { empty: true };
    try {
      return { value: JSON.parse(text) };
    } catch (err) {
      return { error: err.message };
    }
  }

  function refreshControls() {
    const parsed = parseInput();
    const hint = $("log-hint");
    hint.classList.toggle("invalid", Boolean(parsed.error));
    hint.textContent = parsed.error
      ? `Invalid JSON: ${parsed.error}`
      : "Paste one JSON object, or an array of objects to send several events.";
    const ready = selected && selected.can_ingest && !parsed.empty && !parsed.error;
    submitButton.disabled = busy || !ready;
    connectorSelect.disabled = busy || connectorSelect.options.length <= 1;
    $("refresh").disabled = busy;
  }

  function showResult(success, message, log) {
    const result = $("result");
    result.className = `result ${success ? "ok" : "bad"}`;
    result.textContent = `${success ? "Success" : "Failed"}: ${message}`;
    showLog(log);
    $("log-summary").textContent = `Verbose log (${(log || []).length} entries)`;
    $("log-details").open = false;
    $("result-panel").hidden = false;
    $("result-panel").scrollIntoView({ block: "nearest" });
  }

  function showLog(entries) {
    const container = $("log-entries");
    container.replaceChildren(...(entries || []).map((entry) => {
      const row = document.createElement("div");
      row.className = `entry ${entry.level}`;
      const time = document.createElement("time");
      time.textContent = entry.time;
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = entry.title;
      row.append(time, title);
      if (entry.detail) {
        const pre = document.createElement("pre");
        pre.textContent = entry.detail;
        row.append(pre);
      }
      return row;
    }));
  }

  async function callApi(url, options) {
    try {
      const response = await fetch(url, options);
      return await response.json();
    } catch (err) {
      return { success: false, message: `The app's server could not be reached: ${err.message}`, log: [] };
    }
  }

  async function loadConnectors() {
    busy = true;
    selected = null;
    $("details").hidden = true;
    $("connector-hint").hidden = true;
    connectorSelect.replaceChildren(new Option("Loading connectors...", ""));
    refreshControls();
    const data = await callApi("/api/connectors");
    busy = false;
    if (!data.success) {
      connectorSelect.replaceChildren(new Option("Connectors unavailable", ""));
      showResult(false, data.message, data.log);
      refreshControls();
      return;
    }
    const empty = data.connectors.length === 0;
    connectorSelect.replaceChildren(new Option(empty ? "No data connectors found" : "Select a data connector...", ""));
    for (const connector of data.connectors) {
      const suffix = connector.can_ingest ? "" : " (pull: can't receive logs)";
      const option = new Option(`${connector.name}${suffix}`, connector.id);
      option.disabled = !connector.can_ingest;
      connectorSelect.add(option);
    }
    refreshControls();
  }

  async function selectConnector() {
    const request = ++selectionRequest;
    selected = null;
    $("details").hidden = true;
    const id = connectorSelect.value;
    const hint = $("connector-hint");
    hint.hidden = !id;
    hint.classList.remove("invalid");
    hint.textContent = "Reading the assigned parser from Falcon...";
    refreshControls();
    if (!id) return;
    const data = await callApi(`/api/connectors/${encodeURIComponent(id)}/parser`);
    if (request !== selectionRequest) return;
    hint.hidden = true;
    if (!data.success) {
      showResult(false, data.message, data.log);
      refreshControls();
      return;
    }
    selected = data.connector;
    $("d-parser").textContent = selected.parser || "None assigned";
    $("d-type").textContent = selected.source_type || "Unknown";
    $("d-status").textContent = selected.status || "Unknown";
    $("d-vendor").textContent = [selected.vendor_name, selected.vendor_product_name].filter(Boolean).join(" / ") || "Unknown";
    $("details").hidden = false;
    refreshControls();
  }

  async function submitLog() {
    busy = true;
    const label = submitButton.textContent;
    submitButton.textContent = "Cloning and sending (this can take a few minutes)...";
    $("result-panel").hidden = true;
    refreshControls();
    const data = await callApi("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ connector_id: selected.id, log: logInput.value, mode: $("mode").value }),
    });
    busy = false;
    submitButton.textContent = label;
    showResult(data.success, data.message, data.log);
    refreshControls();
  }

  connectorSelect.addEventListener("change", selectConnector);
  $("refresh").addEventListener("click", loadConnectors);
  logInput.addEventListener("input", refreshControls);
  submitButton.addEventListener("click", submitLog);
  $("format").addEventListener("click", () => {
    const parsed = parseInput();
    if (parsed.value !== undefined) logInput.value = JSON.stringify(parsed.value, null, 2);
    refreshControls();
  });
  loadConnectors();
</script>
</body>
</html>
